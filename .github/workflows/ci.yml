# ExamSathi — CI checks
# Runs on every pull request and push to main. Deployment is a Node host (see docs/DEPLOYMENT.md).

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    name: Test, lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Answer key must not ship to the browser
        run: node scripts/check-bundle-leaks.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: npx playwright test
        env:
          CI: true

      - name: MCP server unit tests
        run: cd mcp-server && npm ci && npm test
